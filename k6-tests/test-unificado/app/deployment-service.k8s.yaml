---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unified-app
  namespace: metrics
  labels:
    app: unified-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unified-app
  template:
    metadata:
      labels:
        app: unified-app
        podkubemetrics: "true"
    spec:
      containers:
        - name: unified-app
          image: pablouclm/unified-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          # Probes usando el endpoint /health de la app
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: unified-svc
  namespace: metrics
  labels:
    app: unified-app
spec:
  type: ClusterIP
  selector:
    app: unified-app
  ports:
    - name: http
      port: 80          # Puerto por el que otros pods llaman al servicio
      targetPort: 8080  # Puerto en el que escucha el contenedor