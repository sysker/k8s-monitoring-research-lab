---
name: Lint & Validate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  k8s-validate:
    name: Kubernetes manifest validation
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
          | tar xz && sudo mv kubeconform /usr/local/bin

      - name: Validate manifests
        run: |
          mapfile -t manifests < <(find . -name "*.k8s.yaml" -o -name "*.k8s.yml")

          if [ ${#manifests[@]} -eq 0 ]; then
            echo "No manifests found, skipping validation."
            exit 0
          fi

          kubeconform \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -summary \
            "${manifests[@]}"

  k6-validate:
    name: k6 script validation
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring \
            --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -q && sudo apt-get install -qy k6

      - name: Validate k6 scripts
        run: |
          mapfile -t scripts < <(find k6-tests/ -name '*.js')

          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No k6 scripts found, skipping validation."
            exit 0
          fi

          failed=0
          for script in "${scripts[@]}"; do
            echo "Validating $script..."
            if ! k6 inspect "$script" 2>&1; then
              echo "FAIL: $script"
              failed=1
            fi
          done

          exit $failed